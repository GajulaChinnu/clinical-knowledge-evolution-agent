[project]
name = "clinical-knowledge-evolution-agent"
version = "0.1.0"
description = "Clinical Knowledge Evolution Agent (CKEA) - Multi-agent clinical protocol evolution system"
readme = "README.md"
requires-python = ">=3.11"
# Single source of dependency ranges. requirements.txt is the pinned lock for reproducible installs.
dependencies = [
    "alembic>=1.19.2",
    "apscheduler>=3.11.3",
    "chromadb>=1.5.9",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=3.22.1",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "PyYAML>=6.0.3",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.1.1",
    "streamlit>=1.64.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pypdfium2>=5.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-v"
