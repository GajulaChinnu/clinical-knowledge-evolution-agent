# CKEA Alembic configuration (CLI use: `alembic upgrade head`, `alembic revision -m "..."`).
# The application applies migrations automatically via app.models.database.init_db().
# sqlalchemy.url is taken from DATABASE_URL (.env) by app/models/migrations/env.py.
[alembic]
script_location = app/models/migrations

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
