# CKEA watchlist: the defined set of sources the Monitoring Agent checks.
# The entry id is the stable source identity. All corpus sources are SYNTHETIC.
#
# location:
#   corpus:<path>   a directory under data/corpus/ holding versioned files v<version>.md
#   https://...     a web page or PDF (retrieved through the existing URL ingestion path)
#
# quality_tier (1-5): 5 national guideline body / medicines regulator, 4 randomised trial,
# 3 regional bulletin, 2 observational study, 1 case series / opinion.
version: "1.0"

sources:
  - id: endo-t2d-guideline
    title: SYNTHETIC Type 2 Diabetes Pharmacotherapy Guideline
    location: corpus:endocrinology/t2d-guideline
    source_type: guideline
    publisher: Synthetic National Diabetes Society
    quality_tier: 5
    quality_basis: National guideline body; systematic-review based recommendations.
    departments: [endocrinology]
    treatments: [metformin, gliclazide, empagliflozin]
    check_interval_hours: 24

  - id: cardio-af-guideline
    title: SYNTHETIC Atrial Fibrillation Anticoagulation Guideline
    location: corpus:cardiology/af-anticoagulation-guideline
    source_type: guideline
    publisher: Synthetic Cardiology Council
    quality_tier: 5
    quality_basis: National guideline body; systematic-review based recommendations.
    departments: [cardiology]
    treatments: [apixaban, aspirin]
    check_interval_hours: 24

  - id: neph-ckd-guideline
    title: SYNTHETIC Chronic Kidney Disease Management Guideline
