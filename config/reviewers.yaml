# CKEA reviewer registry: the ONLY source of governance authorization.
# A reviewer may assign, review or decide on Change Briefs only if listed here.
# There are no name/prefix conventions: an identity that is not listed is denied.
#
# governance_role:
#   specialist           routed high-impact briefs for their specialties (taxonomy department ids)
#   governance_chair     routed high-impact briefs with no department, and escalations
#   governance_reviewer  routed standard/low-impact briefs (governance pool)
#
# When SSO is configured (Streamlit st.login / OIDC), the signed-in user's email is
# matched against `email` below to determine the acting reviewer.
#
# The entries below are SYNTHETIC demo identities. Replace them with your governance roster.
version: "1.1"
reviewers:
  - id: dr_smith
    name: Dr. Smith
    role: Clinical Governance Board Member
    governance_role: governance_chair
    specialties: [endocrinology]
    email: dr.smith@example.org
  - id: dr_wilson
    name: Dr. Wilson
    role: Endocrinology Clinical Specialist
    governance_role: specialist
    specialties: [endocrinology]
    email: dr.wilson@example.org
  - id: cardiology_specialist
    name: Cardiology Specialist (demo)
    role: Consultant Cardiologist
    governance_role: specialist
    specialties: [cardiology]
    email: cardiology.specialist@example.org
  - id: clinical_reviewer_2
    name: Clinical Reviewer 2
    role: Subspecialty Care Lead (Nephrology)
    governance_role: specialist
    specialties: [nephrology]
    email: reviewer2@example.org
  - id: infection_specialist
    name: Infection Specialist (demo)
